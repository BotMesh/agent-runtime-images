# Publish runtime images to GHCR.
#
# Trigger: a PR merged into main (or manual dispatch) — the image content
# merge IS the release event. The image reference is derived from this repo:
#   upstream pin  <- tradingagents/Dockerfile (ARG TA_VERSION)
#   shim revision <- SHIM_REVISION below
# so bumping either (and merging) publishes a new reference.
#
# ClawUp's catalog (backend/bot_runtimes.json, tradingagents.default_image)
# must carry the SAME reference — keep them in sync when bumping.
name: publish-runtime-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SHIM_REVISION: shim3

jobs:
  tradingagents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: ref
        run: |
          ta_version=$(sed -n 's/^ARG TA_VERSION=//p' tradingagents/Dockerfile | head -1 | sed 's/^v//')
          if [ -z "$ta_version" ]; then
            echo "::error::could not read TA_VERSION from tradingagents/Dockerfile"
            exit 1
          fi
          image="ghcr.io/botmesh/tradingagents:${ta_version}-${SHIM_REVISION}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker build \
            -t "$IMAGE" \
            -f tradingagents/Dockerfile tradingagents
          docker push "$IMAGE"
          echo "published $IMAGE"
